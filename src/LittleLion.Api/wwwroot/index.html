<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Little Lion · Learn English</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:," />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Fredoka', 'system-ui', 'sans-serif'],
            display: ['Fredoka', 'system-ui', 'sans-serif'],
          },
          colors: {
            brand: {
              amber: '#FFB84C',
              pink: '#FF6B9D',
              teal: '#4ECDC4',
              blue: '#5B9EFF',
              purple: '#A78BFA',
              yellow: '#FFD93D',
              orange: '#FF8C42',
              green: '#22C55E',
              red: '#EF4444',
            },
            ink: {
              DEFAULT: '#2B2A33',
              soft: '#57545E',
            },
            mist: '#A7A3AF',
            cream: '#FFF8ED',
          },
          boxShadow: {
            btn: '0 6px 0 rgba(0, 0, 0, 0.12)',
            'btn-hover': '0 3px 0 rgba(0, 0, 0, 0.12)',
            card: '0 8px 0 rgba(0, 0, 0, 0.12), inset 0 -4px 0 rgba(0, 0, 0, 0.08)',
            soft: '0 4px 0 rgba(0, 0, 0, 0.08)',
          },
          animation: {
            'screen-enter': 'screen-enter 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards',
            'bounce-soft': 'bounce 2s infinite',
            'wiggle': 'wiggle 1s ease-in-out infinite',
            'float': 'float 3s ease-in-out infinite',
            'fall': 'fall linear forwards',
            'toast-enter': 'toast-enter 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards',
            'fade-out': 'fade-out 0.5s forwards',
          },
          keyframes: {
            'screen-enter': {
              '0%': { opacity: 0, transform: 'translateY(12px)' },
              '100%': { opacity: 1, transform: 'translateY(0)' },
            },
            'wiggle': {
              '0%, 100%': { transform: 'rotate(-3deg)' },
              '50%': { transform: 'rotate(3deg)' },
            },
            'float': {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            'fall': {
              '0%': { transform: 'translateY(-10vh) rotate(0deg)', opacity: 1 },
              '100%': { transform: 'translateY(110vh) rotate(720deg)', opacity: 0 },
            },
            'toast-enter': {
              '0%': { transform: 'translateY(-100%) scale(0.5)', opacity: 0 },
              '100%': { transform: 'translateY(0) scale(1)', opacity: 1 },
            },
            'fade-out': {
              '0%': { opacity: 1 },
              '100%': { opacity: 0 },
            },
            'balloon-rise': {
              '0%': { bottom: '-150px' },
              '100%': { bottom: '110vh' }
            },
            'balloon-sway-0': {
              '0%, 100%': { transform: 'translateX(0) rotate(0deg)' },
              '50%': { transform: 'translateX(30px) rotate(5deg)' }
            },
            'balloon-sway-1': {
              '0%, 100%': { transform: 'translateX(0) rotate(0deg)' },
              '50%': { transform: 'translateX(-40px) rotate(-8deg)' }
            },
            'balloon-sway-2': {
              '0%, 100%': { transform: 'translateX(0) rotate(0deg)' },
              '50%': { transform: 'translateX(20px) rotate(-4deg)' }
            },
            'flash': {
              '0%': { opacity: '0.8', transform: 'translate(-50%, -50%) scale(0.2)' },
              '100%': { opacity: '0', transform: 'translate(-50%, -50%) scale(2)' }
            },
            'ring-expand': {
              '0%': { opacity: '1', transform: 'translate(-50%, -50%) scale(0.5)', borderWidth: '8px' },
              '100%': { opacity: '0', transform: 'translate(-50%, -50%) scale(3)', borderWidth: '0px' }
            },
            'float-up': {
              '0%': { opacity: '0', transform: 'translate(-50%, -50%) scale(0.5)' },
              '10%': { opacity: '1', transform: 'translate(-50%, -70%) scale(1.2)' },
              '100%': { opacity: '0', transform: 'translate(-50%, -150%) scale(1)' }
            },
            'streamer': {
              '0%': { opacity: '1', transform: 'translate(-50%, -50%) scale(0.5)' },
              '100%': { opacity: '0', transform: 'translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--rot)) scale(1)' }
            }
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .text-shadow {
        text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
      }
      .text-shadow-strong {
        text-shadow: 0 4px 0 rgba(0,0,0,0.15);
      }
      .screen {
        @apply absolute inset-0 flex flex-col opacity-0 animate-screen-enter;
      }
    }
    html, body {
      @apply h-full font-sans text-ink antialiased select-none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: radial-gradient(circle at 20% 20%, #FFE5B4 0%, #FFD1DC 50%, #E0E7FF 100%);
      @apply flex items-center justify-center p-0 md:p-4 min-h-screen overflow-hidden;
    }
    button {
      @apply cursor-pointer outline-none;
    }
  </style>
</head>
<body>
  <div id="app" class="w-full h-full md:rounded-3xl md:shadow-2xl overflow-hidden relative bg-gradient-to-br from-cream via-white to-[#EEF4FF] border-0 md:border-8 md:border-white/50 flex flex-col max-w-[1200px] max-h-[900px] mx-auto" aria-live="polite"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
